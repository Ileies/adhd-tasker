<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="theme-color" content="#111827" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>ADHD Tasker - Stay Focused</title>
		<meta
			name="description"
			content="A simple 24-hour task management application designed to help individuals with ADHD manage their tasks and stay focused."
		/>
		<script src="https://accounts.google.com/gsi/client" async></script>
		<script>
			try {
				const saved = localStorage.getItem('theme');
				const now = new Date();
				const minutes = now.getHours() * 60 + now.getMinutes();
				const start = Number(localStorage.getItem('dayStart') ?? 420);
				const end = Number(localStorage.getItem('dayEnd') ?? 1140);
				const isDay =
					start <= end ? minutes >= start && minutes < end : minutes >= start || minutes < end;
				const dark = saved === 'dark' || ((saved === 'auto' || !saved) && !isDay);
				document.documentElement.classList.toggle('dark', dark);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
